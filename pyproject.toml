[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "ramico"
dynamic = ["version", "readme"]
description = "Region-Aware Minimal Counterfactual Rules: model-agnostic extraction of global counterfactual rules from black-box classifiers"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Claudio Daka" },
    { name = "Guido Gagliardi" },
    { name = "Antonio Luca Alfeo" },
    { name = "Mario G. C. A. Cimino" },
]
maintainers = [{ name = "Claudio Daka", email = "claudio.daka99@outlook.it" }]
keywords = [
    "explainable-ai",
    "xai",
    "counterfactual-explanations",
    "rule-extraction",
    "interpretability",
    "model-agnostic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "gower>=0.1.2",
]

[project.optional-dependencies]
# YDF has Windows wheels only up to 0.8.0 (Python <= 3.12)
plausibility = ["ydf>=0.8; platform_system != 'Windows' or python_version < '3.13'"]
# kaleido exports the static copies of the figures (viz.show)
viz = ["matplotlib>=3.7", "plotly>=5.18", "great_tables>=0.10", "kaleido>=1.0"]
benchmark = ["scipy>=1.10", "tqdm>=4.66"]
tutorials = [
    "ramico[viz,benchmark,plausibility]",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "ipykernel>=6.29",
    "jinja2>=3.1",  # pandas' DataFrame.style, used by tutorial 01
    "imbalanced-learn>=0.12",  # the resampling of the paper's MLP on Adult, in tutorial 02
]
dev = [
    "ramico[viz,benchmark]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "build>=1.2",
    "twine>=5.0",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "papermill>=2.6",
    "ipykernel>=6.29",
]
# plotly: tools/docs_hooks.py turns the figures of the tutorials into HTML
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25", "mkdocs-jupyter>=0.24", "plotly>=5.18"]

[project.urls]
Homepage = "https://github.com/ClaudioDaka99/RaMiCo"
Source = "https://github.com/ClaudioDaka99/RaMiCo"
Issues = "https://github.com/ClaudioDaka99/RaMiCo/issues"

[tool.hatch.version]
path = "src/ramico/__init__.py"

# The README links to images and files of the repository by relative paths, which GitHub and editors resolve;
# PyPI does not, so the package description gets absolute ones.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((docs/images/[^)]+)\)'
replacement = '](https://raw.githubusercontent.com/ClaudioDaka99/RaMiCo/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/ClaudioDaka99/RaMiCo/blob/main/\1)'

[tool.hatch.build]
# Never ship these, whatever the target; .gitignore alone is not relied upon.
exclude = [
    "*.pdf",
    "data",
    "experiments",
    "examples",
    "docs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ramico"]

[tool.hatch.build.targets.sdist]
only-include = ["src/ramico", "tests", "pyproject.toml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
norecursedirs = [".git", "data", "experiments", "build", "dist", "*.egg-info"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "golden: characterisation tests that freeze the behaviour of the original implementation",
]

[tool.coverage.run]
source = ["ramico"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
# folders kept only locally: the paper's experiments, the datasets
extend-exclude = ["experiments", "data"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "NPY", "PIE", "RUF"]
ignore = [
    "C408",  # dict(...) is the idiom of plotly layouts
    "RUF001",  # ambiguous unicode in strings: the tables use × and ±
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]  # the tests put tests/golden on sys.path before importing the harness
"examples/**" = ["E402", "B018"]  # notebooks import where they first need a module and end cells with a value

[tool.ruff.lint.isort]
known-first-party = ["ramico"]

[tool.mypy]
python_version = "3.11"
files = ["src/ramico"]
exclude = ["experiments/", "data/"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false

[[tool.mypy.overrides]]
# untyped libraries, and optional ones missing from the isolated environment of the pre-commit hook
module = [
    "pandas.*", "gower.*", "ydf.*", "scipy.*", "sklearn.*", "tqdm.*",
    "great_tables.*", "plotly.*", "matplotlib.*", "cycler.*",
]
ignore_missing_imports = true
